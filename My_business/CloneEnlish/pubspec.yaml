name: english_speaking_app

description: "AI English Speaking App"

publish_to: 'none'

version: 1.0.0+1


environment:
  sdk: ^3.9.2


dependencies:

  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8


  # Speech to Text (User voice input)
  speech_to_text: ^7.4.0


  # Local storage
  shared_preferences: ^2.2.3


  # API connection with FastAPI
  http: ^1.2.2


  # Text to Speech (AI voice output)
  flutter_tts: ^4.0.2



dev_dependencies:

  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0



flutter:

  uses-material-design: true